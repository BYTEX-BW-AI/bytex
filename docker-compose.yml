version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bytex-db
    environment:
      POSTGRES_USER: bytex
      POSTGRES_PASSWORD: bytex_secret
      POSTGRES_DB: bytex
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bytex"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bytex-backend
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://bytex:bytex_secret@postgres:5432/bytex
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bytex-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
